[project]
name = "spadesys"
version = "0.1.0"
description = "Simple Pipelines And Data Engineering System: control plane API and worker"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "pandas>=2.2",
  "boto3>=1.35",
  "faker>=30.0",
  "pymysql>=1.1",
  "openpyxl>=3.1",  # .xlsx
  "xlrd>=2.0",  # .xls
  "odfpy>=1.4",  # .ods
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["spadesys*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
